$schema: http://json-schema.org/draft-07/schema#
$id: https://op-foundation.org/spec/ops-1.0.yaml
title: Open Prompt Specification (OPS) v1.0
type: object

required:
  - ops_version
  - meta
  - roles
  - variables
  - rules
  - outputs

properties:
  ops_version:
    type: string
    const: "1.0"

  meta:
    type: object
    required: [name, version, description]
    properties:
      name:
        type: string
      version:
        type: string
      description:
        type: string
      author:
        type: string
      license:
        type: string
      tags:
        type: array
        items:
          type: string
      domain:
        type: string
    additionalProperties: false

  roles:
    type: object
    required: [system, user]
    properties:
      system:
        type: object
        required: [template]
        properties:
          template:
            type: string
        additionalProperties: false
      user:
        type: object
        required: [template]
        properties:
          template:
            type: string
        additionalProperties: false
    additionalProperties: false

  variables:
    type: object
    required: [schema]
    properties:
      schema:
        type: object
        additionalProperties:
          type: string
      required:
        type: array
        items:
          type: string
    additionalProperties: false

  rules:
    type: object
    required: [behavioral_rules, validation_rules, output_rules]
    properties:
      behavioral_rules:
        type: array
        items:
          type: string
      validation_rules:
        type: array
        items:
          type: string
      output_rules:
        type: array
        items:
          type: string
    additionalProperties: false

  outputs:
    type: object
    required: [format]
    properties:
      format:
        type: string
        enum: [text, markdown, json, structured]
      schema:
        type: object
        additionalProperties:
          type: string
    additionalProperties: false

additionalProperties: false
